<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delany Portal</title>
<style>
body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f0f4f8}
.box{background:#fff;padding:40px;border-radius:12px;width:360px;box-shadow:0 2px 20px rgba(0,0,0,0.1)}
h2{color:#0a1f3c;margin:0 0 6px;text-align:center}
p{color:#64748b;font-size:13px;text-align:center;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;margin-bottom:16px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0a1f3c;color:#fff;border:none;border-radius:7px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#1e3a5f}
.err{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:7px;padding:10px;font-size:13px;margin-bottom:16px;display:none}
.ok{background:#f0fdf4;color:#16a34a;border:1px solid #86efac;border-radius:7px;padding:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="box">
  <h2>Delany Products</h2>
  <p>Customer Portal — Sign In</p>
  <div class="err" id="err">Wrong email or password. Try again.</div>
  <div class="ok" id="ok"></div>
  <label>Email</label>
  <input type="text" id="em" placeholder="Enter your email" />
  <label>Password</label>
  <input type="password" id="pw" placeholder="Enter your password" />
  <button id="btn" onclick="tryLogin()">Sign In</button>
</div>

<script>
var users = {
  "admin@delanyproducts.com": {pw:"admin2024", name:"Delany Admin"},
  "101plumbings@delanyportal.com": {pw:"Delany2024", name:"101 Plumbing Supply"},
  "ajplumbinghe@delanyportal.com": {pw:"Delany2024", name:"A & J Plumbing Heating"},
  "ajsupplyinc@delanyportal.com": {pw:"Delany2024", name:"A & J Supply Inc"},
  "ahspliesincd@delanyportal.com": {pw:"Delany2024", name:"A&H Splies Inc"}
};

function tryLogin() {
  var email = document.getElementById("em").value.trim().toLowerCase();
  var pass = document.getElementById("pw").value.trim();
  
  document.getElementById("err").style.display = "none";
  document.getElementById("ok").style.display = "none";
  
  if (!email || !pass) {
    document.getElementById("err").textContent = "Please enter both email and password.";
    document.getElementById("err").style.display = "block";
    return;
  }
  
  if (users[email] && users[email].pw === pass) {
    document.getElementById("ok").textContent = "Login successful! Welcome, " + users[email].name + ". Full portal loading...";
    document.getElementById("ok").style.display = "block";
    document.getElementById("btn").textContent = "Logged In!";
    document.getElementById("btn").style.background = "#059669";
  } else {
    document.getElementById("err").textContent = "Wrong email or password. Check and try again.";
    document.getElementById("err").style.display = "block";
  }
}

document.getElementById("pw").addEventListener("keydown", function(e) {
  if (e.key === "Enter") tryLogin();
});
document.getElementById("em").addEventListener("keydown", function(e) {
  if (e.key === "Enter") tryLogin();
});
</script>
</body>
</html>
